<!-- Standalone port of product/squads/growth/experiments/AR0239/prototype/
     (Kit/Vite + Alpine version) — all four directions (V1 Trimmed, V2 All
     steps, V3 New layout, V4 Project redesign). Same steps, copy, gating and
     behavior; vanilla JS instead of Alpine, hand-written Zone-token CSS
     instead of Tailwind. See app.js. -->
<div id="shell-content"></div>

<!-- Edit Payment Details modal overlay — sibling of #shell-content, not
     nested inside it, so HubstaffShell's own layout/margin rules never
     affect its fixed positioning. renderPaymentModal() (app.js) owns its
     innerHTML and is-open class. -->
<div id="payment-modal" class="modal-overlay"></div>
